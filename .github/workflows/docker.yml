# Stage 2a: build the app into a container image and push it to
# GitHub Container Registry (GHCR). Runs only on push to main -
# we don't push images for every PR, only for merged/main code.
name: Build and Push Image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # PERMISSIONS: this is the security heart of Stage 2a.
    # By default the automatic GITHUB_TOKEN can read your repo but
    # CANNOT write packages. We explicitly grant "packages: write"
    # so this job can push an image - and nothing more. Least privilege,
    # exactly like scoping an IAM policy to only what's needed.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Log in to GHCR. Note we pass NO hand-made secret here:
      # GITHUB_TOKEN is injected automatically by Actions for every run,
      # and the "packages: write" permission above is what makes it able
      # to push. github.actor is the user who triggered the run.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image and push it. The tag names WHERE it goes:
      #   ghcr.io/<owner>/<repo>:latest
      # We lowercase the repo owner because GHCR requires lowercase names
      # and GitHub usernames can contain capitals.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
