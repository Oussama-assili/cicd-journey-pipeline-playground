# The name that shows up in the GitHub "Actions" tab.
name: CI

# WHEN does this run? These are the "triggers".
# Here: on any push to main, and on any pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A workflow is made of one or more JOBS. Jobs run in parallel by default.
jobs:
  # This job is called "test". The name is yours to choose.
  test:
    # The virtual machine this job runs on. GitHub gives you a fresh Ubuntu box.
    runs-on: ubuntu-latest

    # A job is a sequence of STEPS, run top to bottom on that machine.
    steps:
      # Step 1: check out your repo's code onto the runner.
      # "uses" pulls in a prebuilt action someone else maintains.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: put a specific Python version on the runner.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: install our dependencies.
      # "run" executes a shell command, exactly like typing it in a terminal.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # Step 4: lint. Catches syntax errors and undefined names.
      # If this command exits non-zero, the step fails and the job fails.
      - name: Lint with flake8
        run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      # Step 5: run the tests. Same rule: non-zero exit = failure.
      - name: Run tests
        run: python -m pytest -v
